<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>My ToDo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>My ToDo</h1>
    <p class="completed-count">
      <span id="count">0</span> completed
    </p>

    <div class="input-row">
      <input type="text" id="todo-input">
      <button id="add-btn">OK</button>
    </div>

    <p id="error" class="error hidden">Input must not be empty</p>

    <ul id="todo-list"></ul>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
